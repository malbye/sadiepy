name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package and uploads it to PyPI,
# so GitHub Releases and PyPI always carry the same versions.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag: $TAG, pyproject.toml version: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Tests
        run: pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sadiepy/
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
